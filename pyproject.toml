[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circa-runtime-assurance"
version = "0.6.0"
description = "Research code for witness-structured partial identification and auditable runtime assurance"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yuan Liao"}]
dependencies = [
  "gymnasium>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
pybullet = ["pybullet>=3.2.6"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/yongganzuoziji0818/circa-runtime-assurance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

